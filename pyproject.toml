[project]
name = "fmcg-sales-copilot"
version = "0.1.0"
description = "AI copilot for FMCG sales reps: SQL, forecasting, RAG, agent, API and MCP"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "lightgbm>=4.7.0",
    "mcp>=2.3.0",
    "mlflow>=3.18.0",
    "numpy",
    "openai>=3.52.0",
    "pandas",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "sqlglot>=30.32.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults; these calls are safe.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"evals/report.py" = ["E501"]  # long lines of report prose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real LLM (costs tokens); run with `pytest -m live`"]
addopts = "-m 'not live'"
