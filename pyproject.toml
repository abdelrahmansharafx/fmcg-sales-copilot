[project]
name = "fmcg-sales-copilot"
version = "0.1.0"
description = "AI copilot for FMCG sales reps: SQL, forecasting, RAG, agent, API and MCP"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "numpy",
    "pandas",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
